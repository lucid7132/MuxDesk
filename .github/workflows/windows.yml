name: Windows build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Tag must match package.json version.' }
      - name: Prepare and verify Windows release
        shell: pwsh
        run: ./scripts/prepare-release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: cmux-windows
          path: release/cmux-v*.exe*
          if-no-files-found: error
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $asset = (Resolve-Path "release/cmux-v$version.exe").Path
          gh release create $env:RELEASE_TAG $asset "$asset.sha256" --verify-tag --generate-notes
    permissions:
      contents: write
