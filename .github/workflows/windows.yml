name: Windows build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Tag must match package.json version.' }
      - name: Check PowerShell script syntax
        shell: pwsh
        run: |
          foreach ($script in Get-ChildItem scripts -Filter '*.ps1' -File) {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Host "$($script.Name):$($_.Extent.StartLineNumber): $($_.Message)" }
              throw 'PowerShell syntax validation failed.'
            }
          }
      - name: Prepare and verify Windows release
        shell: pwsh
        run: ./scripts/prepare-release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: cmux-windows
          path: release/cmux-v*.exe*
          if-no-files-found: error
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $asset = (Resolve-Path "release/cmux-v$version.exe").Path
          gh release view $env:RELEASE_TAG --json tagName | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG $asset "$asset.sha256" --clobber
          } else {
            gh release create $env:RELEASE_TAG $asset "$asset.sha256" --verify-tag --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed.' }
    permissions:
      contents: write
